name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从全新部署开始，逐步描述如何触发问题
      placeholder: |
        1. docker compose up -d
        2. 打开 http://localhost:8080/ops/
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与报错
      description: |
        粘贴相关日志片段。**发帖前务必脱敏**：口令、token、cookie、内部地址一律删除。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: PolyTable 版本 / 部署方式（compose / jar）/ MySQL 版本 / 浏览器
    validations:
      required: true
