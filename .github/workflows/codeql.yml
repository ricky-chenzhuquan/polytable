name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'   # 每周一静态安全扫描

permissions:
  contents: read

jobs:
  analyze:
    # CodeQL 免费额度仅限公开仓库；私有仓库未购 Advanced Security 时跳过，
    # 仓库转公开后自动恢复运行。
    if: github.event.repository.private != true
    name: Analyze (java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn -B compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
