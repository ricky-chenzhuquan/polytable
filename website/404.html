<!DOCTYPE html>
<!--
  ============================================================
  PolyTable 官网 · 404 页面
  ============================================================
  本页面为完全自包含版本：样式与图形全部内联，
  在 GitHub Pages 的任意路径深度下都能正常渲染。

  TODO 上线前检查：
    1. 若使用项目站点（仓库名路径部署），"返回首页"的相对链接
       ./index.html 在二级路径下可能失效，建议替换为绝对地址：
       https://YOUR_GITHUB_NAME.github.io/polytable/
    2. 若有正式域名，同步替换为正式地址。
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面不存在 — PolyTable</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --dark-bg: #0a1120;
      --dark-2: #0e1a30;
      --ink: #e8eefb;
      --muted: #9fb0cc;
      --line: rgba(255, 255, 255, 0.09);
      --brand: #3d6ff2;
      --teal: #14b48f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(800px 420px at 80% -10%, rgba(61, 111, 242, 0.30), transparent 62%),
        radial-gradient(700px 420px at 0% 110%, rgba(20, 180, 143, 0.18), transparent 58%),
        linear-gradient(180deg, var(--dark-bg), var(--dark-2));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      line-height: 1.65;
    }
    .nf-card { text-align: center; max-width: 480px; }
    .nf-card .logo-svg { width: 56px; height: 56px; margin-bottom: 24px; }
    .nf-code {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 18px;
      background: linear-gradient(92deg, #8fb4ff, #3ee4c0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nf-card h1 { font-size: 20px; margin-bottom: 10px; }
    .nf-card p { color: var(--muted); font-size: 14px; margin-bottom: 30px; }
    .nf-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nf-btn:hover { transform: translateY(-1px); }
    .nf-btn-primary {
      background: linear-gradient(135deg, var(--brand) 0%, #2f5ce0 60%, var(--teal) 140%);
      color: #fff;
      box-shadow: 0 8px 22px rgba(47, 92, 224, 0.38);
    }
    .nf-btn-ghost {
      color: var(--ink);
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.04);
    }
    .nf-btn svg { width: 15px; height: 15px; }
  </style>
</head>
<body>
  <div class="nf-card">
    <svg class="logo-svg" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="lg404" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4d7cff"/>
          <stop offset="1" stop-color="#14b48f"/>
        </linearGradient>
      </defs>
      <rect x="2.5" y="2.5" width="43" height="43" rx="10.5" fill="url(#lg404)"/>
      <rect x="10.5" y="13" width="27" height="6" rx="1.5" fill="#ffffff" fill-opacity="0.92"/>
      <rect x="10.5" y="21" width="27" height="14" rx="1.5" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.8"/>
      <path d="M10.5 25.5h27M10.5 30h27" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.4"/>
      <path d="M19.5 21v14M28.5 21v14" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.4"/>
      <rect x="19.5" y="25.5" width="9" height="4.5" fill="#ffffff" fill-opacity="0.38"/>
    </svg>

    <div class="nf-code">404</div>
    <h1>这一格是空的</h1>
    <p>你要找的页面不存在，可能已被移动或删除。</p>

    <div class="nf-actions">
      <!-- TODO: 项目站点部署时建议替换为绝对地址，见文件顶部注释 -->
      <a class="nf-btn nf-btn-primary" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        返回首页
      </a>
      <!-- TODO: 替换为正式 GitHub 仓库地址 -->
      <a class="nf-btn nf-btn-ghost" href="https://github.com/YOUR_GITHUB_NAME/polytable" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6 2 12l6 6"/><path d="m16 6 6 6-6 6"/></svg>
        GitHub 源码
      </a>
    </div>
  </div>
</body>
</html>
