<!--
  PolyTable 站点图标（内联 SVG，无外部依赖）
  设计：圆角方块 2×2 网格，共享同一条连续渐变（#4f46e5 → #7c3aed）。
  TODO: 如替换品牌色，同步修改 index.html 中内联 logo 的渐变。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="g" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="3.5" y="3.5" width="18.5" height="18.5" rx="5.5" fill="url(#g)"/>
  <rect x="26" y="3.5" width="18.5" height="18.5" rx="5.5" fill="url(#g)" opacity="0.82"/>
  <rect x="3.5" y="26" width="18.5" height="18.5" rx="5.5" fill="url(#g)" opacity="0.82"/>
  <rect x="26" y="26" width="18.5" height="18.5" rx="5.5" fill="url(#g)"/>
</svg>
